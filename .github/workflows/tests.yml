name: Tests

on:
  push:
    branches: [main, master, "feat/**", "test/**"]
  pull_request:
  workflow_dispatch:
  # Reused by the Docker workflow so an image is only built/published after
  # the same checks pass.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The suite is offline: it builds a synthetic pictogram library, so the
      # ~338 MB PNG set is never needed. Only icons/metadata_de.json ships.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest --cov=arasaac_mcp --cov-report=term-missing

      - name: Check generated skill is up to date
        run: uv run python scripts/build_skill.py --check
