name: Docker

on:
  push:
    branches: [main, master, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image ships only icons/metadata_de.json (~9 MB); pictograms are
      # fetched on demand at runtime, so CI never downloads the ~338 MB set and
      # never hits ARASAAC.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: arasaac-mcp:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm arasaac-mcp:ci-${{ github.sha }} --help
