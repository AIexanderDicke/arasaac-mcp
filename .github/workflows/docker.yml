name: Docker

# Triggered only after the Checks workflow succeeds on `main`, so the image is
# built/published exactly once and never duplicates the lint/format/type/test
# jobs. `workflow_run` (instead of reusing tests.yml via workflow_call) avoids
# running those checks a second time on every main push.
on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The image ships only icons/metadata_de.json (~9 MB); pictograms are
      # fetched on demand at runtime, so CI never downloads the ~338 MB set and
      # never hits ARASAAC.
      - name: Resolve image name
        id: image
        # GHCR repository names must be lowercase (owner may not be).
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Published after a successful `main` checks run; manual runs on other
      # refs build locally and are never pushed.
      - name: Log in to GHCR
        if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'workflow_run' && github.ref != 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          image="${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"
          # A successful main run publishes, so the image must be pulled back.
          if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker pull "$image"
          fi
          docker run --rm "$image" --help
