name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Reuse the test workflow (ruff, ruff format, mypy, pytest, skill drift) so an
  # image is only built after the checks pass.
  checks:
    uses: ./.github/workflows/tests.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image ships only icons/metadata_de.json (~9 MB); pictograms are
      # fetched on demand at runtime, so CI never downloads the ~338 MB set and
      # never hits ARASAAC.
      - name: Resolve image name
        id: image
        # GHCR repository names must be lowercase (owner may not be).
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only pushes to `main` are published; PRs and manual runs build locally.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # Pull requests (and manual runs) build and load locally; a push to `main`
      # publishes to GHCR.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          image="${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"
          # A main push publishes, so the image must be pulled back first.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker pull "$image"
          fi
          docker run --rm "$image" --help
