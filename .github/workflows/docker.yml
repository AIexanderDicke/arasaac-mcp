name: Docker

on:
  push:
    branches: [main, master, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The icons come from the published icon base image (see Dockerfile /
      # icons-image.yml); no per-run download, so ARASAAC is never hit here.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: arasaac-mcp:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
