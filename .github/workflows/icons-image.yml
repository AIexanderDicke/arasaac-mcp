name: Icon base image

# Builds and pushes ghcr.io/<owner>/arasaac-icons:<tag> — the pictogram base
# image the app Dockerfile is based on. This is the only job that downloads
# from ARASAAC, so run it manually and only to refresh the icon set.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (icon flavour, e.g. de-500)
        required: true
        default: de-500
      lang:
        description: Language code
        required: true
        default: de
      size:
        description: Icon width in px
        required: true
        default: "500"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arasaac-icons" >> "$GITHUB_OUTPUT"

      - name: Download pictograms from ARASAAC
        run: python3 scripts/download_icons.py --lang "${{ inputs.lang }}" --size "${{ inputs.size }}" --out icons

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push icon base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.icons
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
