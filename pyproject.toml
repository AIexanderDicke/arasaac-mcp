[project]
name = "arasaac-mcp"
version = "0.1.0"
description = "Turn an ordered list of ARASAAC pictograms into a sentence strip (image/PDF)"
readme = "README.md"
authors = [
    { name = "Alexander Dicke", email = "adicke.math@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "fastmcp>=2.0",
]

[project.scripts]
arasaac-pictograms = "arasaac_mcp:main"
make-sheet = "arasaac_mcp:main"
arasaac-mcp = "arasaac_mcp.mcp:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
