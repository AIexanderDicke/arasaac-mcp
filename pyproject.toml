[project]
name = "arasaac-mcp"
version = "0.1.0"
description = "Turn an ordered list of ARASAAC pictograms into a sentence strip (image/PDF)"
readme = "README.md"
authors = [
    { name = "Alexander Dicke", email = "adicke.math@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "fastmcp>=2.0",
]

[project.scripts]
arasaac-pictograms = "arasaac_mcp:main"
make-sheet = "arasaac_mcp:main"
arasaac-mcp = "arasaac_mcp.mcp:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["icons", "output"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# E501: line length is enforced by `ruff format`; TRY004: the layout engine
# intentionally raises ValueError for every invalid node, for one uniform message.
ignore = ["E501", "TRY004"]

[tool.ruff.lint.per-file-ignores]
# `resolve_layout_node` returns a dict; the offline script indexes it directly.
"scripts/test_mcp.py" = ["B017"]

[tool.mypy]
python_version = "3.13"
files = ["arasaac_mcp", "scripts"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
